<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08080b">
  <meta name="robots" content="noindex,nofollow">
  <title>meduu</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #08080b; }
    #profile { display: block; width: 100%; height: 100%; border: 0; background: #08080b; }
    #error {
      position: fixed; inset: 0; display: none; place-items: center;
      padding: 24px; color: #c8c8d0; background: #08080b;
      font: 14px/1.6 Inter, ui-sans-serif, system-ui, sans-serif; text-align: center;
    }
    #error.visible { display: grid; }
    #error span { color: #858591; }
  </style>
</head>
<body>
  <iframe id="profile" title="meduu profile" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div id="error" role="status">
    <div>Profile sync is temporarily unavailable.<br><span>Retrying automatically…</span></div>
  </div>
  <script>
    (() => {
      const frame = document.getElementById("profile");
      const error = document.getElementById("error");
      const SYNC_INTERVAL = 60000;
      let firstLoad = true;
      let refreshTimer;

      function sync() {
        const url = "/api/profile?sync=" + Date.now();
        if (!firstLoad) error.classList.remove("visible");
        frame.src = url;
      }

      frame.addEventListener("load", () => {
        firstLoad = false;
        error.classList.remove("visible");
      });

      frame.addEventListener("error", () => {
        error.classList.add("visible");
      });

      sync();
      refreshTimer = window.setInterval(sync, SYNC_INTERVAL);
      window.addEventListener("pagehide", () => window.clearInterval(refreshTimer));
    })();
  </script>
</body>
</html>
